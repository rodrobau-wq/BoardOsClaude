# Render Blueprint — sobe Postgres (com PostGIS) + a API do BoardOS.
# No Render:  New → Blueprint → conectar o repo BoardOsClaude → Apply.
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: boardos-db
    databaseName: boardos
    # plano pago pequeno: o Render só permite UM Postgres free por workspace,
    # e o free expira em ~30 dias. basic-256mb é o menor pago (~US$6/mês).
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: boardos-api
    runtime: python
    plan: free
    branch: main
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    # migrate.py é idempotente (registra migrações aplicadas) → seguro a cada deploy.
    # migrate (crítico) → onboarding demo (best-effort, não bloqueia) → API
    startCommand: python scripts/migrate.py && (python scripts/onboard_crm_demo.py || echo "onboard demo skip") && uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # A app conecta no banco gerenciado. FORCE ROW LEVEL SECURITY garante que,
      # mesmo conectando como owner, o isolamento por tenant continua valendo.
      - key: BOARDOS_ADMIN_DSN
        fromDatabase:
          name: boardos-db
          property: connectionString
      - key: BOARDOS_DSN
        fromDatabase:
          name: boardos-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: BOARDOS_SECRET       # assina os tokens JWT; gerado e guardado pelo Render
        generateValue: true
      - key: SEED_DEMO            # 1 = popula dados/logins demo no boot. Remover em produção real.
        value: "1"

  # Painel visual (static site, free) — consome a API acima.
  - type: web
    name: boardos-painel
    runtime: static
    branch: main
    buildCommand: echo "sem build (HTML estático)"
    staticPublishPath: ./web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Site de produto (landing pública, static site, free).
  - type: web
    name: boardos-site
    runtime: static
    branch: main
    buildCommand: echo "sem build (HTML estático)"
    staticPublishPath: ./site
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
