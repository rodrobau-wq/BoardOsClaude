; Copie para agente_crm.ini (mesma pasta) e preencha.
; O arquivo fica SÓ na máquina do escritório — não commite o .ini preenchido.

[crm]
; DSN do Postgres do CRM (alcançável pela VPN desta máquina).
; Peça um usuário SOMENTE-LEITURA ao fornecedor do CRM.
dsn = postgresql://usuario_leitura:senha@host-do-crm:5432/retailcrm_crema

; Janela rolante da sincronização diária (dias re-enviados a cada execução;
; sobreposição é segura — o BoardOS faz upsert por dia × loja).
dias_janela = 7

; Query de agregação dia × loja. Ajuste nomes de tabela/colunas ao esquema
; real do CRM. Precisa devolver: data, loja_codigo, faturamento
; (opcionais: cupons, itens). Os parâmetros %(desde)s e %(ate)s são datas.
query = SELECT v.data_venda::date        AS data,
               v.id_store::text          AS loja_codigo,
               sum(v.valor_total)        AS faturamento,
               count(DISTINCT v.num_cupom) AS cupons,
               sum(v.qtd_itens)          AS itens
          FROM vendas v
         WHERE v.data_venda::date BETWEEN %(desde)s AND %(ate)s
         GROUP BY 1, 2
         ORDER BY 1, 2

[boardos]
api = https://boardos-api.onrender.com
; Crie um usuário dedicado para a integração em Minha Rede → Usuários
; (papel Admin ou Estratégico) — não use a sua conta pessoal.
email = integracao@suarede.com.br
senha = TROQUE-ESTA-SENHA
